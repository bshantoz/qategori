plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qategori.kartu'
    compileSdk 34

    defaultConfig {
        applicationId 'com.qategori.kartu'
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName '2.14.0'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Keystore release TIDAK disimpan di repo. Di GitHub Actions file-nya
            // dibuat dari Secret KEYSTORE_BASE64 (lihat .github/workflows/build.yml),
            // kata sandi & alias dibaca dari environment (Secrets).
            // KEYSTORE_PATH relatif terhadap folder app/.
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'qategori-release.keystore')
            storeType 'PKCS12'
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Login Google bawaan aplikasi (Credential Manager) — dipakai MainActivity.
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
