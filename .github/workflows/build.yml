name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: QategoriKartu-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Terbitkan ke Release (supaya bisa diunduh dari HP)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk QategoriKartu.apk
          gh release view terbaru >/dev/null 2>&1 || gh release create terbaru --title "Qategori Kartu (APK terbaru)" --notes "Unduh QategoriKartu.apk lalu pasang di HP."
          gh release upload terbaru QategoriKartu.apk --clobber
