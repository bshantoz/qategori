name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ambil materi nihongo
        uses: actions/checkout@v4
        with:
          repository: bshantoz/nihongo
          path: nihongo_src

      - name: Bundel materi dan halaman situs ke dalam aplikasi
        run: |
          A=app/src/main/assets/web
          mkdir -p $A/nihongo $A/site
          (cd nihongo_src && find . -type f \( -iname '*.js' -o -iname '*.json' -o -iname '*.html' -o -iname '*.css' -o -iname '*.svg' -o -iname '*.txt' -o -iname '*.csv' \) -not -path './.git/*' | while read -r f; do mkdir -p "../$A/nihongo/$(dirname "$f")"; cp "$f" "../$A/nihongo/$f"; done)
          # Halaman inti diunduh dari www (domain kanonis). TANPA "|| true":
          # kalau gagal, build berhenti — APK tidak boleh terbit dengan bundel kosong.
          curl -fsSL https://www.qategori.com/ -o $A/site/index.html
          curl -fsSL https://www.qategori.com/sitemap-pages.xml -o /tmp/sm.xml || true
          for p in p/bali.html p/bisnis-karir.html p/bookmark.html p/building-cleaning.html p/contact.html p/disclaimer.html p/jawa.html p/jidosha-seibi.html p/kebijakan-pengembalian-dana-refund.html p/kontruksi.html p/level-materi-jlpt.html p/manufaktur.html p/materi-dan-kuis-kanji-metode-bushu.html p/materi-dan-soal-tg2-jlpt.html p/materi-jlpt-n1.html p/materi-jlpt-n2.html p/materi-jlpt-n3.html p/materi-jlpt-n4.html p/materi-jlpt-n5.html p/pelayanan-dan-pabrik-makanan.html p/perhotelan.html p/perikanan.html p/permainan.html p/pertanian.html p/pertanyaan-yang-sering-ditanyakan-faq.html p/privacy-policy.html p/sunda.html p/syarat-ketentuan.html p/tentang.html; do
            mkdir -p "$A/site/$(dirname "$p")"
            curl -fsSL "https://www.qategori.com/$p" -o "$A/site/$p"
          done
          for u in $(grep -o '<loc>[^<]*</loc>' /tmp/sm.xml 2>/dev/null | sed 's/<[^>]*>//g'); do
            p=$(echo "$u" | sed -E 's#https?://[^/]+/##; s/[?].*//')
            [ -n "$p" ] || continue
            mkdir -p "$A/site/$(dirname "$p")"
            curl -fsSL "$u" -o "$A/site/$p" || true
          done
          du -sh $A; find $A -type f | wc -l
          # Verifikasi bundel: semua halaman inti harus ada & tidak kosong,
          # dan total file situs minimal 35 (inti 30 + tambahan dari sitemap).
          test -s $A/site/index.html || { echo "::error::index.html kosong/gagal diunduh"; exit 1; }
          for p in p/bali.html p/bisnis-karir.html p/bookmark.html p/building-cleaning.html p/contact.html p/disclaimer.html p/jawa.html p/jidosha-seibi.html p/kebijakan-pengembalian-dana-refund.html p/kontruksi.html p/level-materi-jlpt.html p/manufaktur.html p/materi-dan-kuis-kanji-metode-bushu.html p/materi-dan-soal-tg2-jlpt.html p/materi-jlpt-n1.html p/materi-jlpt-n2.html p/materi-jlpt-n3.html p/materi-jlpt-n4.html p/materi-jlpt-n5.html p/pelayanan-dan-pabrik-makanan.html p/perhotelan.html p/perikanan.html p/permainan.html p/pertanian.html p/pertanyaan-yang-sering-ditanyakan-faq.html p/privacy-policy.html p/sunda.html p/syarat-ketentuan.html p/tentang.html; do
            test -s "$A/site/$p" || { echo "::error::Halaman inti gagal diunduh: $p"; exit 1; }
          done
          N=$(find $A/site -type f | wc -l)
          echo "File situs terbundel: $N"
          [ "$N" -ge 35 ] || { echo "::error::Bundel situs terlalu sedikit ($N file), kemungkinan unduhan sitemap gagal"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan keystore release (dari Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 belum diisi (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/qategori-release.keystore
          ls -la app/qategori-release.keystore

      - name: Build release APK
        env:
          KEYSTORE_PATH: qategori-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: QategoriKartu-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Terbitkan ke Release (supaya bisa diunduh dari HP)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk QategoriKartu.apk
          gh release view terbaru >/dev/null 2>&1 || gh release create terbaru --title "Qategori Kartu (APK terbaru)" --notes "Unduh QategoriKartu.apk lalu pasang di HP. CATATAN: versi 2.11.0 memakai kunci keamanan baru — hapus aplikasi lama dulu sebelum memasang versi ini."
          gh release upload terbaru QategoriKartu.apk --clobber
