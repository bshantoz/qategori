<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>土木 練習問題 100問 — Kuis</title>
<style>
:root {
  --bg: #e9edf1;
  --card: #ffffff;
  --ink: #16212c;
  --ink-soft: #55626f;
  --line: #cdd5dd;
  --accent: #1f4e8c;
  --accent-ink: #ffffff;
  --ok: #1d8a4c;
  --ok-bg: #dff3e6;
  --ng: #c62f2a;
  --ng-bg: #fbe2e0;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10161d;
    --card: #1a232d;
    --ink: #e8edf2;
    --ink-soft: #9aa7b4;
    --line: #2f3c49;
    --accent: #6ea3e8;
    --accent-ink: #0b1622;
    --ok: #52c98a;
    --ok-bg: #163a29;
    --ng: #ff7a72;
    --ng-bg: #4a1e1c;
  }
}
:root[data-theme="dark"] {
  --bg: #10161d;
  --card: #1a232d;
  --ink: #e8edf2;
  --ink-soft: #9aa7b4;
  --line: #2f3c49;
  --accent: #6ea3e8;
  --accent-ink: #0b1622;
  --ok: #52c98a;
  --ok-bg: #163a29;
  --ng: #ff7a72;
  --ng-bg: #4a1e1c;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
h1 { font-size: 1.5rem; margin: 8px 0 4px; line-height: 1.3; }
.sub { color: var(--ink-soft); margin: 0 0 20px; font-size: .95rem; }
button { font: inherit; color: inherit; }
.hidden { display: none !important; }

/* start */
.menu { display: grid; gap: 10px; margin: 16px 0; }
.mode {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; text-align: left; padding: 16px; border-radius: 12px;
  background: var(--card); border: 2px solid var(--line); cursor: pointer;
}
.mode:hover, .mode:focus-visible { border-color: var(--accent); outline: none; }
.mode b { font-size: 1.05rem; display: block; }
.mode small { color: var(--ink-soft); }
.mode .cnt { font-size: 1.4rem; font-weight: 700; color: var(--accent); white-space: nowrap; }
.opts-row { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 8px 0 0; color: var(--ink-soft); font-size: .95rem; }
.opts-row label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; min-height: 32px; }
.opts-row input { width: 18px; height: 18px; accent-color: var(--accent); }

/* quiz */
.top { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding: 8px 0 10px; z-index: 2; }
.stat { display: flex; justify-content: space-between; align-items: baseline; font-size: .95rem; color: var(--ink-soft); }
.stat strong { color: var(--ink); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; margin-top: 8px; }
.tag { font-size: .8rem; color: var(--accent); margin: 0 0 8px; }
.q-jp { font-size: 1.15rem; font-weight: 600; margin: 0; line-height: 1.6; }
.q-ro { font-size: .85rem; font-style: italic; color: var(--ink-soft); margin: 6px 0 0; line-height: 1.5; }
.choices { display: grid; gap: 10px; margin-top: 16px; }
.choice {
  display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
  padding: 12px; border-radius: 10px; border: 2px solid var(--line);
  background: var(--card); cursor: pointer; min-height: 54px;
}
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.choice .ltr {
  flex: none; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700; font-size: .9rem;
  background: var(--bg); border: 1px solid var(--line);
}
.choice .txt { flex: 1; min-width: 0; }
.choice .jp { display: block; font-size: 1rem; }
.choice .ro { display: block; font-size: .8rem; font-style: italic; color: var(--ink-soft); line-height: 1.4; margin-top: 2px; }
.choice:disabled { cursor: default; }
.choice.ok { border-color: var(--ok); background: var(--ok-bg); }
.choice.ok .ltr { background: var(--ok); border-color: var(--ok); color: #fff; }
.choice.ng { border-color: var(--ng); background: var(--ng-bg); }
.choice.ng .ltr { background: var(--ng); border-color: var(--ng); color: #fff; }
.choice.dim { opacity: .55; }
.fb { margin-top: 14px; padding: 12px; border-radius: 10px; font-size: .95rem; }
.fb.ok { background: var(--ok-bg); border-left: 5px solid var(--ok); }
.fb.ng { background: var(--ng-bg); border-left: 5px solid var(--ng); }
.fb b { display: block; margin-bottom: 2px; }
.fb.ok b { color: var(--ok); }
.fb.ng b { color: var(--ng); }
.actions { display: flex; gap: 10px; margin-top: 16px; }
.btn {
  flex: 1; padding: 14px 16px; border-radius: 10px; border: 2px solid var(--accent);
  background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; min-height: 50px;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.linkbtn { background: none; border: 0; color: var(--ink-soft); text-decoration: underline; cursor: pointer; padding: 6px 0; font-size: .9rem; }

/* result */
.score { text-align: center; padding: 20px 8px 8px; }
.score .big { font-size: 3.4rem; font-weight: 800; line-height: 1.1; }
.score .big.good { color: var(--ok); }
.score .big.bad { color: var(--ng); }
.score p { margin: 6px 0; color: var(--ink-soft); }
.review { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.review li { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--ng); border-radius: 10px; padding: 12px; }
.review .rq { font-weight: 600; margin: 0; }
.review .rr { font-size: .8rem; font-style: italic; color: var(--ink-soft); margin: 2px 0 6px; }
.review .ra { margin: 0; color: var(--ok); font-weight: 600; font-size: .95rem; }
.review .rm { margin: 2px 0 0; font-size: .85rem; color: var(--ink-soft); }
.allok { text-align: center; padding: 16px; border-radius: 12px; background: var(--ok-bg); color: var(--ok); font-weight: 700; margin-top: 12px; }
.no-ro .q-ro, .no-ro .choice .ro, .no-ro .review .rr { display: none; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<main id="app">

<section id="start">
  <h1>土木 練習問題 100問</h1>
  <p class="sub">Doboku renshū mondai — kuis latihan. Jawaban benar berwarna hijau, salah berwarna merah.</p>
  <div class="menu">
    <button class="mode" data-mode="all"><span><b>全問 (Zenmon) — Semua soal</b><small>Teori + praktik</small></span><span class="cnt">100</span></button>
    <button class="mode" data-mode="riron"><span><b>理論 (Riron) — Teori</b><small>Soal 1–60</small></span><span class="cnt">60</span></button>
    <button class="mode" data-mode="jitsugi"><span><b>実技 (Jitsugi) — Praktik</b><small>Soal 61–100</small></span><span class="cnt">40</span></button>
  </div>
  <div class="opts-row">
    <label><input type="checkbox" id="optShuffle"> Acak urutan soal</label>
    <label><input type="checkbox" id="optRomaji" checked> Tampilkan romaji</label>
  </div>
</section>

<section id="quiz" class="hidden">
  <div class="top">
    <div class="stat"><span id="pos">1 / 100</span><span>Benar: <strong id="okc">0</strong> · Salah: <strong id="ngc">0</strong></span></div>
    <div class="bar"><i id="barfill"></i></div>
  </div>
  <div class="card">
    <p class="tag" id="tag"></p>
    <p class="q-jp" id="qjp"></p>
    <p class="q-ro" id="qro"></p>
    <div class="choices" id="choices"></div>
    <div id="fb" class="fb hidden" role="status" aria-live="polite"></div>
    <div class="actions">
      <button class="btn" id="next" disabled>Lanjut</button>
    </div>
  </div>
  <p style="text-align:center;margin-top:10px"><button class="linkbtn" id="quit">Berhenti dan kembali ke menu</button></p>
</section>

<section id="result" class="hidden">
  <div class="score">
    <div class="big" id="rbig">0</div>
    <p id="rsub"></p>
  </div>
  <div class="actions">
    <button class="btn" id="retryWrong">Ulangi yang salah</button>
    <button class="btn ghost" id="restart">Menu</button>
  </div>
  <div id="reviewWrap"></div>
</section>

</main>

<script>
const DATA = [{"n": 1, "jp": "日本の建設現場で一番大切にしていることは何ですか。", "ro": "Nihon no kensetsu genba de ichiban taisetsu ni shite iru koto wa nan desu ka.", "opts": [{"l": "A", "jp": "工期を短くすること", "ro": "kōki o mijikaku suru koto"}, {"l": "B", "jp": "事故を防ぐこと", "ro": "jiko o fusegu koto"}, {"l": "C", "jp": "費用を安くすること", "ro": "hiyō o yasuku suru koto"}, {"l": "D", "jp": "早く帰ること", "ro": "hayaku kaeru koto"}], "sec": "第1章 日本の現場で大切にしていること", "a": "B", "note": "Yang terpenting di lokasi: mencegah kecelakaan", "part": "riron"}, {"n": 2, "jp": "工事全体をまとめる会社を、通称何と呼びますか。", "ro": "Kōji zentai o matomeru kaisha o, tsūshō nan to yobimasu ka.", "opts": [{"l": "A", "jp": "設計者", "ro": "sekkeisha"}, {"l": "B", "jp": "監理者", "ro": "kanrisha"}, {"l": "C", "jp": "ゼネコン", "ro": "zenekon"}, {"l": "D", "jp": "職長", "ro": "shokuchō"}], "sec": "第1章 日本の現場で大切にしていること", "a": "C", "note": "Perusahaan pengelola seluruh proyek = ゼネコン", "part": "riron"}, {"n": 3, "jp": "工事が図面通りに行われているかどうかを確認する立場の技術者は誰ですか。", "ro": "Kōji ga zumen dōri ni okonawarete iru ka dō ka o kakunin suru tachiba no gijutsusha wa dare desu ka.", "opts": [{"l": "A", "jp": "発注者", "ro": "hatchūsha"}, {"l": "B", "jp": "設計者", "ro": "sekkeisha"}, {"l": "C", "jp": "監理者", "ro": "kanrisha"}, {"l": "D", "jp": "職長", "ro": "shokuchō"}], "sec": "第1章 日本の現場で大切にしていること", "a": "C", "note": "監理者 memeriksa apakah pekerjaan sesuai gambar", "part": "riron"}, {"n": 4, "jp": "建設キャリアアップシステムでは、技能者のレベルはいくつに分けられていますか。", "ro": "Kensetsu kyaria appu shisutemu de wa, ginōsha no reberu wa ikutsu ni wakerarete imasu ka.", "opts": [{"l": "A", "jp": "2つ", "ro": "futatsu"}, {"l": "B", "jp": "4つ", "ro": "yottsu"}, {"l": "C", "jp": "3つ", "ro": "mittsu"}, {"l": "D", "jp": "5つ", "ro": "itsutsu"}], "sec": "第1章 日本の現場で大切にしていること", "a": "B", "note": "Level CCUS ada 4", "part": "riron"}, {"n": 5, "jp": "建設キャリアアップシステムで、技能者の評価の対象にならないものはどれですか。", "ro": "Kensetsu kyaria appu shisutemu de, ginōsha no hyōka no taishō ni naranai mono wa dore desu ka.", "opts": [{"l": "A", "jp": "経験（就業日数）(keiken / shūgyō nissū)", "ro": ""}, {"l": "B", "jp": "知識・技能（保有資格）(chishiki・ginō / hoyū shikaku)", "ro": ""}, {"l": "C", "jp": "マネジメント能力", "ro": "manejimento nōryoku"}, {"l": "D", "jp": "国籍", "ro": "kokuseki"}], "sec": "第1章 日本の現場で大切にしていること", "a": "D", "note": "Yang dinilai: pengalaman, pengetahuan/keterampilan, kemampuan manajemen (bukan kewarganegaraan)", "part": "riron"}, {"n": 6, "jp": "レベル2になるには、システム登録後に何日以上の就業日数が必要ですか。", "ro": "Reberu ni ni naru ni wa, shisutemu tōroku-go ni nan-nichi ijō no shūgyō nissū ga hitsuyō desu ka.", "opts": [{"l": "A", "jp": "30日", "ro": "sanjū-nichi"}, {"l": "B", "jp": "365日", "ro": "sanbyaku rokujūgo-nichi"}, {"l": "C", "jp": "645日", "ro": "roppyaku yonjūgo-nichi"}, {"l": "D", "jp": "1000日", "ro": "sen-nichi"}], "sec": "第1章 日本の現場で大切にしていること", "a": "C", "note": "Level 2 butuh 645 hari kerja (±3 tahun)", "part": "riron"}, {"n": 7, "jp": "「KY活動」のKYは、何の略ですか。", "ro": "\"KY katsudō\" no KY wa, nan no ryaku desu ka.", "opts": [{"l": "A", "jp": "危険予知", "ro": "kiken yochi"}, {"l": "B", "jp": "会議予定", "ro": "kaigi yotei"}, {"l": "C", "jp": "工事要求", "ro": "kōji yōkyū"}, {"l": "D", "jp": "記録用紙", "ro": "kiroku yōshi"}], "sec": "第1章 日本の現場で大切にしていること", "a": "A", "note": "KY = Kiken Yochi (prediksi bahaya)", "part": "riron"}, {"n": 8, "jp": "その日に新しく現場に入った作業員を、何といいますか。", "ro": "Sono hi ni atarashiku genba ni haitta sagyōin o, nan to iimasu ka.", "opts": [{"l": "A", "jp": "職長", "ro": "shokuchō"}, {"l": "B", "jp": "監理者", "ro": "kanrisha"}, {"l": "C", "jp": "見習い", "ro": "minarai"}, {"l": "D", "jp": "新規入場者", "ro": "shinki nyūjōsha"}], "sec": "第1章 日本の現場で大切にしていること", "a": "D", "note": "Pekerja baru hari itu = 新規入場者", "part": "riron"}, {"n": 9, "jp": "職種ごとの朝礼で、指差しをしながら安全のスローガンを声に出して言うことを何といいますか。", "ro": "Shokushu goto no chōrei de, yubisashi o shinagara anzen no surōgan o koe ni dashite iu koto o nan to iimasu ka.", "opts": [{"l": "A", "jp": "安全唱和（タッチアンドコール）(anzen shōwa / tacchi ando kōru)", "ro": ""}, {"l": "B", "jp": "ラジオ体操", "ro": "rajio taisō"}, {"l": "C", "jp": "新規入場 kumarenai mono wa dore desu ka.", "opts": [{"l": "A", "jp": "墜落・転落", "ro": "tsuiraku・tenraku"}, {"l": "B", "jp": "崩壊・倒壊", "ro": "hōkai・tōkai"}, {"l": "C", "jp": "感電", "ro": "kanden"}, {"l": "D", "jp": "建設機械・クレーンなど災害", "ro": "kensetsu kikai・kurēn nado saigai"}], "sec": "第7章 建設工事の安全（統計・災害・ヒューマンエラー）", "a": "C", "note": "Tiga bencana besar: jatuh, mesin/crane, runtuh (bukan kesetrum)", "part": "riron"}, {"n": 38, "jp": "三大災害以外で多い事故として、テキストに書かれているものはどれですか。", "ro": "Sandai saigai igai de ooi jiko toshite, tekisuto ni kakarete iru mono wa dore desu ka.", "opts": [{"l": "A", "jp": "交通事故（道路）(kōtsū jiko / dōro)", "ro": ""}, {"l": "B", "jp": "火災", "ro": "kasai"}, {"l": "C", "jp": "おぼれ", "ro": "oborē"}, {"l": "D", "jp": "有害物との接触", "ro": "yūgaibutsu to no sesshoku"}], "sec": "第7章 建設工事の安全（統計・災害・ヒューマンエラー）", "a": "A", "note": "Kecelakaan lalu lintas (jalan) banyak", "part": "riron"}, {"n": 39, "jp": "建設現場での死亡災害は、その半数近くが入場後どのくらいの期間以内に発生していますか。", "ro": "Kensetsu genba de no shibō saigai wa, sono hansū chikaku ga nyūjō-go dono kurai no kikan inai ni hassei shite imasu ka.", "opts": [{"l": "A", "jp": "1日", "ro": "ichinichi"}, {"l": "B", "jp": "1週間", "ro": "isshūkan"}, {"l": "C", "jp": "1か月", "ro": "ikkagetsu"}, {"l": "D", "jp": "1年", "ro": "ichinen"}], "sec": "第7章 建設工事の安全（統計・災害・ヒューマンエラー）", "a": "B", "note": "Hampir separuh kematian terjadi dalam 1 minggu setelah masuk", "part": "riron"}, {"n": 40, "jp": "新入者安全衛生教育は、誰が労働者を新しく雇い入れたときに行うものですか。", "ro": "Shinnyūsha anzen eisei kyōiku wa, dare ga rōdōsha o atarashiku yatoiireta toki ni okonau mono desu ka.", "opts": [{"l": "A", "jp": "労働者本人", "ro": "rōdōsha honnin"}, {"l": "B", "jp": "発注者", "ro": "hatchūsha"}, {"l": "C", "jp": "監理者", "ro": "kanrisha"}, {"l": "D", "jp": "事業者", "ro": "jigyōsha"}], "sec": "第7章 建設工事の安全（統計・災害・ヒューマンエラー）", "a": "D", "note": "事業者 (pemberi kerja) yang menyelenggarakan", "part": "riron"}, {"n": 41, "jp": "2022年1月2日から、作業床の高さが何mを超える場合に、フルハーネス型墜落制止用器具の装着が義務付けられましたか。", "ro": "Nisen nijūni-nen ichigatsu futsuka kara, sagyō  "kōtsū rūru"}, {"l": "B", "jp": "火災注意", "ro": "kasai chūi"}, {"l": "C", "jp": "工事の許可", "ro": "kōji no kyoka"}, {"l": "D", "jp": "安全や衛生", "ro": "anzen ya eisei"}], "sec": "第7章 建設工事の安全（統計・災害・ヒューマンエラー）", "a": "D", "note": "Palang hijau = keselamatan & kebersihan/kesehatan", "part": "riron"}, {"n": 46, "jp": "緑十字に、「衛生」を表す白十字を組み合わせた旗を何といいますか。", "ro": "Midori jūji ni, \"eisei\" o arawasu haku jūji o kumiawaseta hata o nan to iimasu ka.", "opts": [{"l": "A", "jp": "安全旗", "ro": "anzenki"}, {"l": "B", "jp": "安全衛生旗", "ro": "anzen eiseiki"}, {"l": "C", "jp": "国旗", "ro": "kokki"}, {"l": "D", "jp": "工事旗", "ro": "kōjiki"}], "sec": "第7章 建設工事の安全（統計・災害・ヒューマンエラー）", "a": "B", "note": "Bendera 安全衛生旗", "part": "riron"}, {"n": 47, "jp": "ヒューマンエラーが起こる原因は、何種類あるとされていますか。", "ro": "Hyūman erā ga okoru gen'in wa, nan-shurui aru to sarete imasu ka.", "opts": [{"l": "A", "jp": "5種類", "ro": "go-shurui"}, {"l": "B", "jp": "8種類", "ro": "hasshurui"}, {"l": "C", "jp": "12種類", "ro": "jūni-shurui"}, {"l": "D", "jp": "20種類", "ro": "nijisshurui"}], "sec": "第7章 建設工事の安全（統計・災害・ヒューマンエラー）", "a": "C", "note": "12 jenis human error", "part": "riron"}, {"n": 48, "jp": "「この場面では、こういう指示が来るはずだ」という思い込みが原因で起こるヒューマンエラーはどれですか。", "ro": "\"Kono bamen de wa, kō iu shiji ga kuru hazu da\" to iu omoikomi ga gen'in de okoru hyūman erā wa dore desu ka.", "opts": [{"l": "A", "jp": "認知ミス", "ro": "ninchi misu"}, {"l": "B", "jp": "不注意", "ro": "fuchūi"}, {"l": "C", "jp": "疲労", "ro": "hirō"}, {"l": "D", "jp": "連絡不足", "ro": "renraku busoku"}], "sec": "第7章 建設工事の安全（統計・災害・ヒューマンエラー）", "a": "A", "note": "Asumsi/salah persepsi = 認知ミス", "part": "riron"}, {"n": 49, "jp": "単純な作業を繰り返しているときに、考えないで無意識に動作をするようになって起こるヒューマンエラーはどれですか。", "ro": "Tanjun na sagyō o kurikaeshite iru toki ni, kangaenai de muishiki ni dōsa o suru yō ni natte okoru hyūman erā wa dore desu ka.", "opts": [{"l": "A", "jp": "経験不足", "ro": "keiken busoku"}, {"l": "B", "jp": "場面行動本能", "ro": "bamen kōdō honnō"}, {"l": "C", "jp": "パニック", "ro": "panikku"}, {"l": "D", "jp": "注意や意識の低下   for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function applyRomaji() {
  document.getElementById('app').classList.toggle('no-ro', !$('optRomaji').checked);
}
$('optRomaji').addEventListener('change', applyRomaji);

function start(list) {
  state.list = $('optShuffle').checked ? shuffle(list) : list.slice();
  state.i = 0; state.ok = 0; state.ng = 0; state.wrong = [];
  applyRomaji();
  show('quiz');
  render();
}

function render() {
  const q = state.list[state.i];
  const total = state.list.length;
  state.locked = false;
  $('pos').textContent = (state.i + 1) + ' / ' + total;
  $('okc').textContent = state.ok;
  $('ngc').textContent = state.ng;
  $('barfill').style.width = (state.i / total * 100) + '%';
  $('tag').textContent = '第' + q.n + '問 · ' + (q.part === 'riron' ? '理論' : '実技') + ' · ' + q.sec.replace(/^第\d章\s*/, '');
  $('qjp').textContent = q.jp;
  $('qro').textContent = q.ro;
  const box = $('choices');
  box.innerHTML = '';
  q.opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.dataset.l = o.l;
    const l = document.createElement('span'); l.className = 'ltr'; l.textContent = o.l;
    const t = document.createElement('span'); t.className = 'txt';
    const jp = document.createElement('span'); jp.className = 'jp'; jp.textContent = o.jp;
    const ro = document.createElement('span'); ro.className = 'ro'; ro.textContent = o.ro;
    t.append(jp, ro);
    b.append(l, t);
    b.addEventListener('click', () => answer(o.l));
    box.appendChild(b);
  });
  $('fb').className = 'fb hidden';
  $('fb').textContent = '';
  $('next').disabled = true;
  $('next').textContent = state.i === total - 1 ? 'Lihat hasil' : 'Lanjut';
}

function answer(letter) {
  if (state.locked) return;
  state.locked = true;
  const q = state.list[state.i];
  const good = letter === q.a;
  if (good) state.ok++; else { state.ng++; state.wrong.push(q); }
  document.querySelectorAll('#choices .choice').forEach(b => {
    b.disabled = true;
    const l = b.dataset.l;
    const mark = b.querySelector('.ltr');
    if (l === q.a) { b.classList.add('ok'); mark.textContent = '✓'; }
    else if (l === letter) { b.classList.add('ng'); mark.textContent = '✗'; }
    else b.classList.add('dim');
  });
  const fb = $('fb');
  fb.className = 'fb ' + (good ? 'ok' : 'ng');
  fb.textContent = '';
  const h = document.createElement('b');
  h.textContent = good ? 'Benar! 正解 (seikai)' : 'Salah. Jawaban yang benar: ' + q.a;
  const p = document.createElement('span');
  p.textContent = q.note;
  fb.append(h, p);
  $('okc').textContent = state.ok;
  $('ngc').textContent = state.ng;
  $('barfill').style.width = ((state.i + 1) / state.list.length * 100) + '%';
  $('next').disabled = false;
  $('next').focus({ preventScroll: true });
}

function next() {
  if (!state.locked) return;
  if (state.i < state.list.length - 1) { state.i++; render(); window.scrollTo(0, 0); }
  else finish();
}

function finish() {
  const total = state.list.length;
  const pct = Math.round(state.ok / total * 100);
  const big = $('rbig');
  big.textContent = state.ok + ' / ' + total;
  big.className = 'big ' + (pct >= 60 ? 'good' : 'bad');
  $('rsub').textContent = pct + '% benar' + (pct >= 60 ? ' — bagus, lanjutkan!' : ' — coba ulangi soal yang salah.');
  const wrap = $('reviewWrap');
  wrap.innerHTML = '';
  if (!state.wrong.length) {
    const d = document.createElement('div');
    d.className = 'allok';
    d.textContent = 'Semua benar! 全問正解 (zenmon seikai)';
    wrap.appendChild(d);
    $('retryWrong').classList.add('hidden');
  } else {
    $('retryWrong').classList.remove('hidden');
    const ul = document.createElement('ul');
    ul.className = 'review';
    state.wrong.forEach(q => {
      const li = document.createElement('li');
      const a = document.createElement('p'); a.className = 'rq'; a.textContent = q.n + '. ' + q.jp;
      const r = document.createElement('p'); r.className = 'rr'; r.textContent = q.ro;
      const c = q.opts.find(o => o.l === q.a);
      const x = document.createElement('p'); x.className = 'ra'; x.textContent = '✓ ' + c.l + '. ' + c.jp;
      const y = document.createElement('p'); y.className = 'rm'; y.textContent = q.note;
      li.append(a, r, x, y);
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
  }
  show('result');
}

document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => {
  const m = b.dataset.mode;
  start(m === 'all' ? DATA : DATA.filter(q => q.part === m));
}));
$('next').addEventListener('click', next);
$('quit').addEventListener('click', () => show('start'));
$('restart').addEventListener('click', () => show('start'));
$('retryWrong').addEventListener('click', () => start(state.wrong));

document.addEventListener('keydown', (e) => {
  if ($('quiz').classList.contains('hidden')) return;
  const k = e.key.toUpperCase();
  if (['A', 'B', 'C', 'D'].includes(k) && !state.locked) answer(k);
  else if (e.key === 'Enter' && state.locked) { e.preventDefault(); next(); }
});
</script>
</body>
</html>
